name: Deploy AutoPreset audio API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audio-service/**'
      - '.github/workflows/deploy-audio-space.yml'

permissions:
  contents: read

jobs:
  deploy:
    # Serviço opcional: não bloqueia a atualização do site sem um Space configurado.
    if: ${{ vars.HF_SPACE_REPO != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade huggingface_hub
      - name: Sync Docker service to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN", "").strip()
          repo_id = os.environ.get("HF_SPACE_REPO", "").strip()
          if not token or not repo_id or "/" not in repo_id:
              raise SystemExit("Configure HF_TOKEN (secret) e HF_SPACE_REPO (variable) nas configurações do GitHub.")

          HfApi(token=token).upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path="audio-service",
              ignore_patterns=["__pycache__", "*.pyc"],
              commit_message="Deploy AutoPreset guitar separation API",
          )
          PY
